<!DOCTYPE html>

<head>

<style>*{box-sizing:border-box}:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}body{margin:0;min-height:100vh;background:#05070d;color:#fff}button,input{font:inherit}button{cursor:pointer}#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:30px;border:1px solid #252c3d;border-radius:20px;background:#0d111c}.logo{text-align:center;font-size:36px;font-weight:700;letter-spacing:8px}.subtitle{text-align:center;color:#919bb0;margin:8px 0 28px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;border:0;border-radius:10px;padding:12px;background:#171d2b;color:#aab3c7;font-weight:700}.tab.active{background:#fff;color:#000}label{display:block;margin:14px 0 7px;color:#b9c1d2;font-size:14px}input{width:100%;padding:14px;border:1px solid #2a3347;border-radius:10px;outline:0;background:#080c14;color:#fff}#submitButton{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:700}#status{min-height:24px;margin-top:15px;color:#aeb7ca;text-align:center;font-size:13px}.layout{min-height:100vh;display:flex}.sidebar{width:250px;padding:22px 15px;border-right:1px solid #1e2534;background:#080b13;display:flex;flex-direction:column}.sidebar-logo{margin:0 10px 28px;font-size:21px;font-weight:700;letter-spacing:5px}.new-chat{width:100%;padding:11px;border:1px solid #2b3448;border-radius:10px;background:#151b29;color:#fff;margin-bottom:15px}.nav-item{margin-bottom:5px;padding:12px;border-radius:9px;color:#aab3c7}.nav-item.active,.nav-item:hover{background:#151b29;color:#fff}.history-title{margin:20px 10px 8px;color:#667086;font-size:11px;text-transform:uppercase}.conversation-list{overflow:auto;max-height:45vh}.conversation{padding:10px;border-radius:9px;color:#aab3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.conversation:hover,.conversation.active{background:#111827;color:#fff}.sidebar-bottom{margin-top:auto;color:#788399;font-size:12px;padding:10px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:70px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2534}.online{color:#aeb7ca;font-size:13px}#logoutButton{margin-left:10px;padding:9px 13px;border:1px solid #2b3448;border-radius:9px;background:#161c29;color:#fff}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:30px 20px 20px}.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#929bb0}.orb{width:105px;height:105px;margin-bottom:25px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#929dff 28%,#4c5bea 55%,#101968 78%,#03040b 100%);box-shadow:0 0 35px rgba(90,105,255,.55),0 0 100px rgba(90,105,255,.18)}.welcome h1{margin:0;color:#fff;font-size:40px}.message-row{display:flex;margin:0 auto 18px;width:min(900px,95%)}.message-row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#20283a}.assistant .bubble{background:#0d111b;border:1px solid #20293a}.composer{width:min(900px,95%);margin:0 auto 25px;padding:9px;display:flex;gap:8px;align-items:center;border:1px solid #252d3e;border-radius:16px;background:#0d111b}.composer input{flex:1;border:0;background:transparent}.icon,.send{width:42px;height:42px;border:0;border-radius:10px}.icon{background:#171d2b;color:#fff}.send{background:#fff;color:#000}.typing{color:#788399;font-size:13px;width:min(900px,95%);margin:0 auto 12px}@media(max-width:700px){.sidebar{width:72px;padding:18px 7px}.sidebar-logo{font-size:10px;letter-spacing:2px;text-align:center}.new-chat{font-size:0;padding:11px}.new-chat:after{content:'+';font-size:20px}.nav-item{font-size:0;text-align:center}.history-title,.conversation,.sidebar-bottom{display:none}.welcome h1{font-size:29px}.topbar{padding:0 12px}.messages{padding-left:8px;padding-right:8px}}</style>
</head>
<body>
<section id="authScreen"><div class="card"><div class="logo">VIRANI</div><div class="subtitle">Your personal AI system</div><div class="tabs"><button type="button" class="tab active" id="loginTab">Login</button><button type="button" class="tab" id="signupTab">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submitButton" type="submit">Sign in</button><div id="status"></div></form></div></section>
<section id="dashboard" style="display:none"><div class="layout"><aside class="sidebar"><div class="sidebar-logo">VIRANI</div><button class="new-chat" id="newChatButton">＋ New chat</button><div class="nav-item active">💬 Chats</div><div class="nav-item">📁 Projects</div><div class="nav-item">🤖 Agents</div><div class="nav-item">🧠 Memory</div><div class="nav-item">📄 Files</div><div class="nav-item">🔗 Apps</div><div class="nav-item">⚙️ Settings</div><div class="history-title">Recent chats</div><div id="conversationList" class="conversation-list"></div><div class="sidebar-bottom">Gemini brain connected</div></aside><main class="main"><header class="topbar"><div class="online">🟢 Virani is online</div><div><span id="userEmail"></span><button id="logoutButton">Log out</button></div></header><section class="chat"><div id="messages" class="messages"><div id="welcome" class="welcome"><div class="orb"></div><h1>Hello. I'm Virani.</h1><p>Ask me anything.</p></div></div><div id="typing" class="typing" style="display:none">Virani is thinking…</div><div class="composer"><button class="icon" id="voiceButton" title="Voice input">🎙️</button><input id="messageInput" placeholder="Ask Virani anything..." autocomplete="off"><button class="icon" id="attachButton">📎</button><button class="send" id="sendButton">➤</button></div></section></main></div></section>
<script>
(()=>{'use strict';const URL='https://hfczfnaaqwsmvgahiygc.supabase.co',KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS',BRAIN_URL=URL+'/functions/v1/virani-gemini';let sb,mode='login',user,currentConversation;const $=id=>document.getElementById(id),authScreen=$('authScreen'),dashboard=$('dashboard'),status=$('status'),messages=$('messages'),list=$('conversationList'),input=$('messageInput'),send=$('sendButton'),typing=$('typing');function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('submitButton').textContent=m==='signup'?'Create account':'Sign in';status.textContent=''}function show(u){user=u;authScreen.style.display='none';dashboard.style.display='block';$('userEmail').textContent=user.email||'';loadConversations()}function login(){dashboard.style.display='none';authScreen.style.display='flex';user=null;currentConversation=null}function clear(){messages.innerHTML='<div id="welcome" class="welcome"><div class="orb"></div><h1>Hello. I\'m Virani.</h1><p>Ask me anything.</p></div>'}function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-US';utterance.rate=.95;utterance.pitch=1;window.speechSynthesis.speak(utterance)}function add(role,text){const w=$('welcome');if(w)w.remove();const r=document.createElement('div');r.className='message-row '+(role==='user'?'user':'assistant');const b=document.createElement('div');b.className='bubble';b.textContent=text;r.appendChild(b);messages.appendChild(r);messages.scrollTop=messages.scrollHeight;if(role==='assistant')speak(text)}async function profile(u){await sb.from('profiles').upsert({id:u.id,email:u.email,display_name:u.email?.split('@')[0]||'Virani User'})}async function loadConversations(){list.innerHTML='';const{data,error}=await sb.from('conversations').select('id,title,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(30);if(error)return;for(const c of data||[]){const e=document.createElement('div');e.className='conversation';e.textContent=c.title||'New Chat';e.onclick=()=>openConversation(c.id);list.appendChild(e)}}async function newConversation(title='New Chat'){const{data,error}=await sb.from('conversations').insert({user_id:user.id,title}).select().single();if(error){add('assistant','I could not create the chat.');return null}currentConversation=data;clear();return data}async function openConversation(id){const{data:c}=await sb.from('conversations').select('*').eq('id',id).eq('user_id',user.id).single();if(!c)return;currentConversation=c;clear();const{data:ms}=await sb.from('messages').select('role,content').eq('conversation_id',id).eq('user_id',user.id).order('created_at');for(const m of ms||[])add(m.role,m.content)}async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;if(!currentConversation){currentConversation=await newConversation(text.slice(0,60)||'New Chat');if(!currentConversation)return}input.value='';add('user',text);send.disabled=true;typing.style.display='block';try{const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Your session expired. Please log in again.');const{error:saveErr}=await sb.from('messages').insert({conversation_id:currentConversation.id,user_id:user.id,role:'user',content:text});if(saveErr)throw saveErr;const res=await fetch(BRAIN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({message:text})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Virani brain request failed');add('assistant',data.reply);const{error:assistantErr}=await sb.from('messages').insert({conversation_id:currentConversation.id,user_id:user.id,role:'assistant',content:data.reply});if(assistantErr)console.warn('Assistant save failed:',assistantErr.message);await sb.from('conversations').update({title:text.slice(0,60),updated_at:new Date().toISOString()}).eq('id',currentConversation.id).eq('user_id',user.id);await loadConversations()}catch(e){console.error(e);add('assistant','I could not reach my AI brain: '+(e.message||'Please try again.'))}finally{typing.style.display='none';send.disabled=false;input.focus()}}async function init(){sb=window.supabase.createClient(URL,KEY);const{data}=await sb.auth.getSession();if(data.session){await profile(data.session.user);show(data.session.user)}else login()}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){status.textContent='Enter a valid email and a password of at least 6 characters.';return}$('submitButton').disabled=true;status.textContent=mode==='signup'?'Creating account...':'Signing in...';try{const r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){status.textContent='Account created. Check your email, confirm it, then sign in.';setMode('login')}else{await profile(r.data.user);show(r.data.user)}}catch(e){status.textContent=e.message||'Authentication failed.'}finally{$('submitButton').disabled=false}};$('logoutButton').onclick=async()=>{await sb.auth.signOut();login()};$('newChatButton').onclick=()=>newConversation();send.onclick=sendMessage;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}};$('attachButton').onclick=()=>alert('File tools are coming next.');$('voiceButton').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Voice input is not supported in this browser yet.');return}const r=new R();r.lang='en-US';r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};r.start()};init()})();
</script></body></html>
