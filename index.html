<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virani AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #05070d;
      color: white;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: min(430px, 100%);
      background: #0d111c;
      border: 1px solid #252c3d;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 8px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #919bb0;
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #171d2b;
      color: #aab3c7;
      font-weight: bold;
    }

    .tab.active {
      background: white;
      color: black;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #b9c1d2;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #080c14;
      border: 1px solid #2a3347;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #7884ff;
    }

    #submitButton {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      min-height: 22px;
      margin-top: 15px;
      color: #aeb7ca;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
      min-height: 100vh;
    }

    .layout {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: #080b13;
      border-right: 1px solid #1e2534;
      padding: 22px 15px;
    }

    .sidebar-logo {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 5px;
      margin: 0 10px 28px;
    }

    .nav-item {
      padding: 12px;
      margin-bottom: 5px;
      border-radius: 9px;
      color: #aab3c7;
    }

    .nav-item.active,
    .nav-item:hover {
      background: #151b29;
      color: white;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #1e2534;
    }

    .online {
      color: #aeb7ca;
      font-size: 13px;
    }

    #logoutButton {
      margin-left: 10px;
      padding: 9px 13px;
      border-radius: 9px;
      background: #161c29;
      border: 1px solid #2b3448;
      color: white;
      cursor: pointer;
    }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .orb {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      margin-bottom: 25px;
      background:
        radial-gradient(
          circle at 35% 35%,
          white,
          #929dff 28%,
          #4c5bea 55%,
          #101968 78%,
          #03040b 100%
        );
      box-shadow:
        0 0 35px rgba(90, 105, 255, 0.55),
        0 0 100px rgba(90, 105, 255, 0.18);
    }

    .center h1 {
      margin: 0;
      font-size: 40px;
    }

    .center p {
      color: #929bb0;
    }

    .composer {
      width: min(900px, 90%);
      margin: 0 auto 25px;
      padding: 9px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0d111b;
      border: 1px solid #252d3e;
      border-radius: 16px;
    }

    .composer input {
      flex: 1;
      border: 0;
      background: transparent;
    }

    .icon {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #171d2b;
      color: white;
      cursor: pointer;
    }

    .send {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 18px 7px;
      }

      .sidebar-logo {
        font-size: 10px;
        letter-spacing: 2px;
        text-align: center;
      }

      .nav-item {
        font-size: 0;
        text-align: center;
      }

      .nav-item::first-letter {
        font-size: 18px;
      }

      .center h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN / SIGNUP -->

  <section id="authScreen">

    <div class="card">

      <div class="logo">VIRANI</div>

      <div class="subtitle">
        Your personal AI system
      </div>

      <div class="tabs">

        <button
          type="button"
          class="tab active"
          id="loginTab">
          Login
        </button>

        <button
          type="button"
          class="tab"
          id="signupTab">
          Create account
        </button>

      </div>

      <form id="authForm">

        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          minlength="6"
          required
        >

        <button
          id="submitButton"
          type="submit">
          Sign in
        </button>

        <div id="status"></div>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard">

    <div class="layout">

      <aside class="sidebar">

        <div class="sidebar-logo">
          VIRANI
        </div>

        <div class="nav-item active">💬 Chats</div>
        <div class="nav-item">📁 Projects</div>
        <div class="nav-item">🤖 Agents</div>
        <div class="nav-item">🧠 Memory</div>
        <div class="nav-item">📄 Files</div>
        <div class="nav-item">🔗 Apps</div>
        <div class="nav-item">⚙️ Settings</div>

      </aside>

      <main class="main">

        <header class="topbar">

          <div class="online">
            🟢 Virani is online
          </div>

          <div>
            <span id="userEmail"></span>

            <button
              id="logoutButton"
              type="button">
              Log out
            </button>
          </div>

        </header>

        <div class="center">

          <div class="orb"></div>

          <h1>Hello. I'm Virani.</h1>

          <p>
            Your personal AI system.
          </p>

        </div>

        <div class="composer">

          <button
            type="button"
            class="icon">
            🎙️
          </button>

          <input
            id="messageInput"
            placeholder="Ask Virani anything..."
          >

          <button
            type="button"
            class="icon">
            📎
          </button>

          <button
            type="button"
            class="send">
            ➤
          </button>

        </div>

      </main>

    </div>

  </section>


  <script>

    /* ==================================================
       SUPABASE SETTINGS
       ================================================== */

    const SUPABASE_URL =
      https://hfczfnaaqwsmvgahiygc.supabase.co/rest/v1/

    const SUPABASE_PUBLISHABLE_KEY =
   sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS


    /* ==================================================
       CONNECT TO SUPABASE
       ================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ==================================================
       ELEMENTS
       ================================================== */

    const authScreen =
      document.getElementById("authScreen");

    const dashboard =
      document.getElementById("dashboard");

    const authForm =
      document.getElementById("authForm");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const submitButton =
      document.getElementById("submitButton");

    const status =
      document.getElementById("status");

    const userEmail =
      document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");


    let mode = "login";


    /* ==================================================
       LOGIN TAB
       ================================================== */

    loginTab.addEventListener("click", function () {

      mode = "login";

      loginTab.classList.add("active");

      signupTab.classList.remove("active");

      submitButton.textContent = "Sign in";

      status.textContent = "";

    });


    /* ==================================================
       SIGNUP TAB
       ================================================== */

    signupTab.addEventListener("click", function () {

      mode = "signup";

      signupTab.classList.add("active");

      loginTab.classList.remove("active");

      submitButton.textContent = "Create account";

      status.textContent = "";

    });


    /* ==================================================
       LOGIN / SIGNUP
       ================================================== */

    authForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      status.textContent = "Please wait...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      try {

        /* CREATE ACCOUNT */

        if (mode === "signup") {

          const result =
            await supabaseClient.auth.signUp({

              email: email,

              password: password

            });


          if (result.error) {

            throw result.error;

          }


          if (!result.data.session) {

            status.textContent =
              "Account created. Check your email to confirm your account.";

            return;

          }


          await saveProfile(result.data.user);

          showDashboard(result.data.user);

          return;
        }


        /* LOGIN */

        const result =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (result.error) {

          throw result.error;

        }


        await saveProfile(result.data.user);

        showDashboard(result.data.user);

      }

      catch (error) {

        console.error(error);

        status.textContent =
          error.message ||
          "Something went wrong.";

      }

    });


    /* ==================================================
       SAVE PROFILE
       ================================================== */

    async function saveProfile(user) {

      if (!user) {
        return;
      }

      const result =
        await supabaseClient
          .from("profiles")
          .upsert({

            id: user.id,

            email: user.email,

            display_name:
              user.email
                ? user.email.split("@")[0]
                : "Virani User"

          });


      if (result.error) {

        console.error(
          "Profile error:",
          result.error
        );

      }

    }


    /* ==================================================
       SHOW DASHBOARD
       ================================================== */

    function showDashboard(user) {

      authScreen.style.display = "none";

      dashboard.style.display = "block";

      userEmail.textContent =
        user?.email || "Virani User";

    }


    /* ==================================================
       SHOW LOGIN
       ================================================== */

    function showLogin() {

      dashboard.style.display = "none";

      authScreen.style.display = "flex";

    }


    /* ==================================================
       LOGOUT
       ================================================== */

    logoutButton.addEventListener("click", async function () {

      await supabaseClient.auth.signOut();

      showLogin();

    });


    /* ==================================================
       CHECK EXISTING SESSION
       ================================================== */

    async function checkSession() {

      const result =
        await supabaseClient.auth.getSession();

      const session =
        result.data.session;

      if (session && session.user) {

        showDashboard(session.user);

      } else {

        showLogin();

      }

    }


    /* ==================================================
       START VIRANI
       ================================================== */

    checkSession();

  </script>

</body>
</html>
