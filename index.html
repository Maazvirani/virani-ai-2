<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virani AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #05070c;
      color: white;
      overflow: hidden;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      height: 100%;
      background: #080b13;
      border-right: 1px solid #1c2230;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 35px;
      padding-left: 10px;
    }

    .new-chat {
      background: white;
      color: #07090f;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      padding: 12px 14px;
      border-radius: 10px;
      color: #aeb6c9;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-item:hover {
      background: #121725;
      color: white;
    }

    .nav-item.active {
      background: #151b2a;
      color: white;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid #1c2230;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aeb6c9;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #36d399;
      box-shadow: 0 0 12px rgba(54, 211, 153, 0.7);
    }

    .profile {
      width: 38px;
      height: 38px;
      background: #151b2a;
      border: 1px solid #262e41;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CHAT */

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 50px 15%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome {
      text-align: center;
      max-width: 720px;
      margin: auto;
    }

    .orb {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 28px;

      background:
        radial-gradient(
          circle at 35% 35%,
          #ffffff,
          #8995ff 30%,
          #4354e9 55%,
          #101a68 75%,
          #030513 100%
        );

      box-shadow:
        0 0 30px rgba(82, 98, 255, 0.55),
        0 0 100px rgba(82, 98, 255, 0.18);
    }

    .welcome h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 1px;
    }

    .welcome p {
      color: #8f98ad;
      font-size: 16px;
      margin-top: 12px;
    }

    /* INPUT */

    .composer-area {
      padding: 20px 15% 28px;
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: auto;

      display: flex;
      align-items: center;
      gap: 10px;

      background: #0d111b;
      border: 1px solid #252c3d;
      border-radius: 18px;
      padding: 10px;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 13px;
      font-size: 15px;
    }

    .composer input::placeholder {
      color: #677188;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #151b2a;
      color: white;
      cursor: pointer;
      font-size: 17px;
    }

    .icon-button:hover {
      background: #20283b;
    }

    .send-button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .sidebar {
        width: 72px;
        padding: 18px 8px;
      }

      .logo {
        font-size: 12px;
        letter-spacing: 2px;
        text-align: center;
      }

      .new-chat {
        font-size: 0;
      }

      .new-chat::after {
        content: "+";
        font-size: 20px;
      }

      .nav-item {
        text-align: center;
        font-size: 0;
      }

      .nav-item::first-letter {
        font-size: 18px;
      }

      .messages,
      .composer-area {
        padding-left: 6%;
        padding-right: 6%;
      }

      .welcome h1 {
        font-size: 31px;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      VIRANI
    </div>

    <button class="new-chat">
      + New Chat
    </button>

    <div class="nav">

      <div class="nav-item active">
        💬 Chats
      </div>

      <div class="nav-item">
        📁 Projects
      </div>

      <div class="nav-item">
        🤖 Agents
      </div>

      <div class="nav-item">
        🧠 Memory
      </div>

      <div class="nav-item">
        📄 Files
      </div>

      <div class="nav-item">
        🔗 Apps
      </div>

      <div class="nav-item">
        ⚙️ Settings
      </div>

    </div>

    <div class="sidebar-bottom">

      <div class="nav-item">
        👤 Profile
      </div>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="status">
        <span class="status-dot"></span>
        Virani is online
      </div>

      <div class="profile">
        👤
      </div>

    </header>


    <!-- CHAT -->

    <section class="chat">

      <div class="messages">

        <div class="welcome">

          <div class="orb"></div>

          <h1>
            Hello. I'm Virani.
          </h1>

          <p>
            Your personal AI system.
          </p>

        </div>

      </div>


      <div class="composer-area">

        <div class="composer">

          <button
            class="icon-button"
            title="Voice"
            onclick="alert('Voice will be connected in a later step.')">
            🎙️
          </button>

          <input
            type="text"
            placeholder="Ask Virani anything..."
            id="messageInput"
          >

          <button
            class="icon-button"
            title="Attach file"
            onclick="alert('File uploads will be connected in a later step.')">
            📎
          </button>

          <button
            class="send-button"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </section>

  </main>

</div>


<script>

  function sendMessage() {

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (!message) {
      return;
    }

    alert(
      "Virani received:\n\n" +
      message +
      "\n\nThe AI brain will be connected in the next step."
    );

    input.value = "";

  }

</script>

</body>
</html>
