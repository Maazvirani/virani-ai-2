<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#030405">
<title>Virani AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}:root{color-scheme:dark;font-family:Inter,Arial,Helvetica,sans-serif}html,body{margin:0;width:100%;min-height:100%;background:#020304;color:#fff}button,input{font:inherit}button{cursor:pointer}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 35%,#17120b 0,#07080a 32%,#020304 70%)}.card{width:min(430px,100%);padding:30px;border:1px solid #30271b;border-radius:20px;background:#0b0c0d;box-shadow:0 0 60px #000}.logo{text-align:center;font-size:36px;font-weight:700;letter-spacing:8px}.subtitle{text-align:center;color:#9a9388;margin:8px 0 28px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;border:0;border-radius:10px;padding:12px;background:#171717;color:#aaa;font-weight:700}.tab.active{background:#f4f1eb;color:#080808}label{display:block;margin:14px 0 7px;color:#bbb4aa;font-size:14px}input{width:100%;padding:14px;border:1px solid #38322b;border-radius:10px;outline:0;background:#070808;color:#fff}#submitButton{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#f4f1eb;color:#000;font-weight:700}#status{min-height:24px;margin-top:15px;color:#b5ada2;text-align:center;font-size:13px}
#dashboard{display:none;min-height:100vh;background:#020304;position:relative;overflow:hidden}.shell{min-height:100vh;display:flex;position:relative}.sidebar{width:245px;padding:20px 14px;border-right:1px solid #17130f;background:rgba(5,5,5,.92);display:flex;flex-direction:column;z-index:5}.sidebar-logo{margin:0 10px 25px;font-size:21px;font-weight:700;letter-spacing:5px;color:#f2eee7}.new-chat{width:100%;padding:11px;border:1px solid #30271f;border-radius:10px;background:#11100e;color:#eee;margin-bottom:15px}.nav-item{margin-bottom:5px;padding:11px 12px;border-radius:9px;color:#8f8a82}.nav-item.active,.nav-item:hover{background:#171411;color:#fff}.history-title{margin:20px 10px 8px;color:#615b53;font-size:11px;text-transform:uppercase}.conversation-list{overflow:auto;max-height:45vh}.conversation{padding:10px;border-radius:9px;color:#8e8981;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.conversation:hover,.conversation.active{background:#12100e;color:#fff}.sidebar-bottom{margin-top:auto;color:#6d665d;font-size:12px;padding:10px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #14110e;background:rgba(2,3,4,.7);backdrop-filter:blur(10px);z-index:4}.online{color:#9b948a;font-size:13px}.online b{color:#d7d0c5}.top-actions{display:flex;align-items:center;gap:10px}#userEmail{color:#756e65;font-size:12px}#logoutButton{padding:8px 12px;border:1px solid #302a23;border-radius:9px;background:#11100f;color:#d7d0c8}
.chat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}.messages{position:absolute;inset:0;overflow:auto;padding:25px 20px 150px;z-index:2;pointer-events:none}.message-row{display:flex;margin:0 auto 16px;width:min(900px,95%);pointer-events:auto}.message-row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 30px #0005}.user .bubble{background:#24201b}.assistant .bubble{background:#0d0d0d;border:1px solid #2a241e}.welcome{position:absolute;inset:64px 0 100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#817a70;z-index:1}.welcome h1{margin:15px 0 5px;color:#e8e2d8;font-size:34px;letter-spacing:3px}.welcome p{margin:0;color:#777066}.orb-wrap{width:330px;height:330px;display:flex;align-items:center;justify-content:center;position:relative}.orb-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:#ff6b0030;filter:blur(45px);animation:glow 3s ease-in-out infinite}.orb{position:relative;width:205px;height:205px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff8d9 0 2%,#ffcf54 4%,#ff8b13 12%,#ff5b00 24%,#1c0900 45%,#050505 65%,#020304 100%);box-shadow:0 0 18px #ffb12b,0 0 45px #ff6900aa,0 0 110px #ff450055;overflow:visible}.orb:before,.orb:after{content:"";position:absolute;inset:-45px;border:1px solid #ff8a1c99;border-radius:50%;transform:rotate(25deg) scaleY(.35);box-shadow:0 0 15px #ff6a0088}.orb:after{inset:-25px;transform:rotate(-35deg) scaleY(.5);border-color:#ffd36a66}.orb-core{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 20px #fff,0 0 55px #ff8b00}.ray{position:absolute;left:50%;top:50%;width:310px;height:1px;background:linear-gradient(90deg,transparent,#ff8a18aa,transparent);transform-origin:center;animation:spin 7s linear infinite}.ray.r2{transform:rotate(60deg)}.ray.r3{transform:rotate(120deg)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{50%{transform:scale(1.15);opacity:.7}}
.status-line{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid #30271f;border-radius:999px;background:#080807dd;color:#91897f;font-size:12px;white-space:nowrap;backdrop-filter:blur(8px)}.status-dot{width:8px;height:8px;border-radius:50%;background:#777}.status-dot.on{background:#ff8a19;box-shadow:0 0 12px #ff6a00;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.45}}
.composer{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(900px,95%);padding:9px;display:flex;gap:8px;align-items:center;border:1px solid #2a241e;border-radius:17px;background:#0b0b0bdd;backdrop-filter:blur(12px);z-index:7;box-shadow:0 15px 45px #000}.composer input{flex:1;border:0;background:transparent;color:#fff}.icon,.send{width:44px;height:44px;border:0;border-radius:11px}.icon{background:#151311;color:#fff;border:1px solid #29231d}.icon.listening{background:#351508;border-color:#ff7418;color:#ff9c42;box-shadow:0 0 18px #ff5c0033}.send{background:#f4f1eb;color:#050505}.typing{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);color:#756e65;font-size:12px;z-index:6}.ultron-label{position:absolute;right:18px;bottom:92px;color:#5e5750;font-size:10px;letter-spacing:2px;z-index:6}
@media(max-width:760px){.sidebar{display:none}.topbar{height:56px;padding:0 12px}.welcome{inset:45px 0 100px}.orb-wrap{width:270px;height:270px}.orb{width:160px;height:160px}.ray{width:240px}.welcome h1{font-size:25px}.messages{padding-left:8px;padding-right:8px}.composer{bottom:12px}.status-line{bottom:76px}.ultron-label{display:none}}
</style>
</head>
<body>
<section id="authScreen"><div class="card"><div class="logo">VIRANI</div><div class="subtitle">Your personal AI system</div><div class="tabs"><button type="button" class="tab active" id="loginTab">Login</button><button type="button" class="tab" id="signupTab">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submitButton" type="submit">Sign in</button><div id="status"></div></form></div></section>
<section id="dashboard"><div class="shell"><aside class="sidebar"><div class="sidebar-logo">VIRANI</div><button class="new-chat" id="newChatButton">＋ New chat</button><div class="nav-item active">◉ Chats</div><div class="nav-item">▦ Projects</div><div class="nav-item">◇ Agents</div><div class="nav-item">◈ Memory</div><div class="nav-item">□ Files</div><div class="nav-item">⌘ Apps</div><div class="nav-item">⚙ Settings</div><div class="history-title">Recent chats</div><div id="conversationList" class="conversation-list"></div><div class="sidebar-bottom">Gemini brain connected</div></aside><main class="main"><header class="topbar"><div class="online">● <b>Virani</b> is online</div><div class="top-actions"><span id="userEmail"></span><button id="logoutButton">Log out</button></div></header><section class="chat"><div id="messages" class="messages"></div><div id="welcome" class="welcome"><div class="orb-wrap"><div class="orb-glow"></div><div class="ray"></div><div class="ray r2"></div><div class="ray r3"></div><div class="orb"><div class="orb-core"></div></div></div><h1>VIRANI</h1><p>Your personal AI system</p></div><div id="typing" class="typing" style="display:none">Virani is thinking…</div><div class="status-line"><span id="statusDot" class="status-dot"></span><span id="voiceStatus">Microphone off</span><span>•</span><span>ULTRON VOICE</span></div><div class="ultron-label">VOICE SYSTEM ONLINE</div><div class="composer"><button class="icon" id="voiceButton" title="Toggle always-on microphone">🎙️</button><input id="messageInput" placeholder="Talk to Virani or type..." autocomplete="off"><button class="icon" id="attachButton" title="Files">📎</button><button class="send" id="sendButton" title="Send">➤</button></div></section></main></div></section>
<script>
(()=>{'use strict';
const URL='https://hfczfnaaqwsmvgahiygc.supabase.co',KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS',BRAIN_URL=URL+'/functions/v1/virani-gemini';
let sb,mode='login',user,currentConversation,recognition=null,listening=false,speaking=false,voiceReady=false,voiceSendTimer;
const $=id=>document.getElementById(id),authScreen=$('authScreen'),dashboard=$('dashboard'),status=$('status'),messages=$('messages'),list=$('conversationList'),input=$('messageInput'),send=$('sendButton'),typing=$('typing'),voiceButton=$('voiceButton'),voiceStatus=$('voiceStatus'),statusDot=$('statusDot'),welcome=$('welcome');
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('submitButton').textContent=m==='signup'?'Create account':'Sign in';status.textContent=''}
function show(u){user=u;authScreen.style.display='none';dashboard.style.display='block';$('userEmail').textContent=user.email||'';loadConversations();setTimeout(()=>enableVoice(),600)}
function login(){dashboard.style.display='none';authScreen.style.display='flex';user=null;currentConversation=null;disableVoice()}
function clear(){messages.innerHTML='';welcome.style.display='flex'}
function add(role,text){welcome.style.display='none';const r=document.createElement('div');r.className='message-row '+(role==='user'?'user':'assistant');const b=document.createElement('div');b.className='bubble';b.textContent=text;r.appendChild(b);messages.appendChild(r);messages.scrollTop=messages.scrollHeight;if(role==='assistant')speak(text)}
function chooseVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>/en-US|en-GB/i.test(v.lang)&&/male|david|daniel|alex|mark|google us english/i.test(v.name))||voices.find(v=>/en-US|en-GB/i.test(v.lang))||voices[0]}
function speak(text){if(!('speechSynthesis' in window))return;speaking=true;stopRecognition();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=.48;u.volume=1;const v=chooseVoice();if(v)u.voice=v;u.onend=()=>{speaking=false;if(listening)setTimeout(startRecognition,250)};u.onerror=()=>{speaking=false;if(listening)setTimeout(startRecognition,250)};speechSynthesis.speak(u)}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{voiceReady=true};
function setListening(on){listening=on;voiceButton.classList.toggle('listening',on);voiceButton.textContent=on?'🔴':'🎙️';statusDot.classList.toggle('on',on);voiceStatus.textContent=on?'Listening…':'Microphone off';if(on)startRecognition();else stopRecognition()}
function startRecognition(){if(!listening||speaking)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){voiceStatus.textContent='Voice input not supported';return}if(!recognition){recognition=new R();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onresult=e=>{let finalText='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=(e.results[i][0].transcript||'')+' '}if(finalText.trim()){input.value=(input.value+' '+finalText.trim()).trim();clearTimeout(voiceSendTimer);voiceSendTimer=setTimeout(()=>sendMessage(),700)}};recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;voiceButton.classList.remove('listening');voiceButton.textContent='🎙️';statusDot.classList.remove('on');voiceStatus.textContent='Microphone permission required'}else if(e.error!=='aborted'){voiceStatus.textContent='Listening…'}};recognition.onend=()=>{if(listening&&!speaking)setTimeout(()=>{try{recognition.start()}catch(e){}},300)}}try{recognition.start();voiceStatus.textContent='Listening…'}catch(e){}}
function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}}}
function enableVoice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){voiceStatus.textContent='Use Chrome or Edge for voice';return}setListening(true)}
function disableVoice(){listening=false;stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel();voiceButton.classList.remove('listening');voiceButton.textContent='🎙️';statusDot.classList.remove('on');voiceStatus.textContent='Microphone off'}
async function profile(u){await sb.from('profiles').upsert({id:u.id,email:u.email,display_name:u.email?.split('@')[0]||'Virani User'})}
async function loadConversations(){list.innerHTML='';if(!user)return;const{data,error}=await sb.from('conversations').select('id,title,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(30);if(error)return;for(const c of data||[]){const e=document.createElement('div');e.className='conversation';e.textContent=c.title||'New Chat';e.onclick=()=>openConversation(c.id);list.appendChild(e)}}
async function newConversation(title='New Chat'){const{data,error}=await sb.from('conversations').insert({user_id:user.id,title}).select().single();if(error){add('assistant','I could not create the chat.');return null}currentConversation=data;clear();return data}
async function openConversation(id){const{data:c}=await sb.from('conversations').select('*').eq('id',id).eq('user_id',user.id).single();if(!c)return;currentConversation=c;clear();const{data:ms}=await sb.from('messages').select('role,content').eq('conversation_id',id).eq('user_id',user.id).order('created_at');for(const m of ms||[])add(m.role,m.content)}
async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;if(!currentConversation){currentConversation=await newConversation(text.slice(0,60)||'New Chat');if(!currentConversation)return}input.value='';add('user',text);send.disabled=true;typing.style.display='block';try{const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Your session expired. Please log in again.');const{error:saveErr}=await sb.from('messages').insert({conversation_id:currentConversation.id,user_id:user.id,role:'user',content:text});if(saveErr)throw saveErr;const res=await fetch(BRAIN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({message:text})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Virani brain request failed');add('assistant',data.reply);const{error:assistantErr}=await sb.from('messages').insert({conversation_id:currentConversation.id,user_id:user.id,role:'assistant',content:data.reply});if(assistantErr)console.warn('Assistant save failed:',assistantErr.message);await sb.from('conversations').update({title:text.slice(0,60),updated_at:new Date().toISOString()}).eq('id',currentConversation.id).eq('user_id',user.id);await loadConversations()}catch(e){console.error(e);add('assistant','I could not reach my AI brain: '+(e.message||'Please try again.'))}finally{typing.style.display='none';send.disabled=false;input.focus()}}
async function init(){sb=window.supabase.createClient(URL,KEY);const{data}=await sb.auth.getSession();if(data.session){await profile(data.session.user);show(data.session.user)}else login()}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){status.textContent='Enter a valid email and a password of at least 6 characters.';return}$('submitButton').disabled=true;status.textContent=mode==='signup'?'Creating account...':'Signing in...';try{const r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){status.textContent='Account created. Check your email, confirm it, then sign in.';setMode('login')}else{await profile(r.data.user);show(r.data.user)}}catch(e){status.textContent=e.message||'Authentication failed.'}finally{$('submitButton').disabled=false}};
$('logoutButton').onclick=async()=>{await sb.auth.signOut();login()};$('newChatButton').onclick=()=>newConversation();send.onclick=sendMessage;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}};$('attachButton').onclick=()=>alert('File tools are coming next.');voiceButton.onclick=()=>setListening(!listening);init();
})();
</script>
</body>
</html>
