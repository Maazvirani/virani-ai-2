.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #14110e;background:rgba(2,3,4,.7);backdrop-filter:blur(10px);z-index:4}.online{color:#9b948a;font-size:13px}.online b{color:#d7d0c5}.top-actions{display:flex;align-items:center;gap:10px}#userEmail{color:#756e65;font-size:12px}#logoutButton{padding:8px 12px;border:1px solid #302a23;border-radius:9px;background:#11100f;color:#d7d0c8}
.chat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}.messages{position:absolute;inset:0;overflow:auto;padding:25px 20px 150px;z-index:2;pointer-events:none}.message-row{display:flex;margin:0 auto 16px;width:min(900px,95%);pointer-events:auto}.message-row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 30px #0005}.user .bubble{background:#24201b}.assistant .bubble{background:#0d0d0d;border:1px solid #2a241e}.welcome{position:absolute;inset:64px 0 100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#817a70;z-index:1}.welcome h1{margin:15px 0 5px;color:#e8e2d8;font-size:34px;letter-spacing:3px}.welcome p{margin:0;color:#777066}.orb-wrap{width:330px;height:330px;display:flex;align-items:center;justify-content:center;position:relative}.orb-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:#ff6b0030;filter:blur(45px);animation:glow 3s ease-in-out infinite}.orb{position:relative;width:205px;height:205px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff8d9 0 2%,#ffcf54 4%,#ff8b13 12%,#ff5b00 24%,#1c0900 45%,#050505 65%,#020304 100%);box-shadow:0 0 18px #ffb12b,0 0 45px #ff6900aa,0 0 110px #ff450055;overflow:visible}.orb:before,.orb:after{content:"";position:absolute;inset:-45px;border:1px solid #ff8a1c99;border-radius:50%;transform:rotate(25deg) scaleY(.35);box-shadow:0 0 15px #ff6a0088}.orb:after{inset:-25px;transform:rotate(-35deg) scaleY(.5);border-color:#ffd36a66}.orb-core{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 20px #fff,0 0 55px #ff8b00}.ray{position:absolute;left:50%;top:50%;width:310px;height:1px;background:linear-gradient(90deg,transparent,#ff8a18aa,transparent);transform-origin:center;animation:spin 7s linear infinite}.ray.r2{transform:rotate(60deg)}.ray.r3{transform:rotate(120deg)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{50%{transform:scale(1.15);opacity:.7}}

@media(max-width:760px){.sidebar{display:none}.topbar{height:56px;padding:0 12px}.welcome{inset:45px 0 100px}.orb-wrap{width:270px;height:270px}.orb{width:160px;height:160px}.ray{width:240px}.welcome h1{font-size:25px}.messages{padding-left:8px;padding-right:8px}.composer{bottom:12px}.status-line{bottom:76px}.ultron-label{display:none}}

<body>
<section id="authScreen"><div class="card"><div class="logo">VIRANI</div><div class="subtitle">Your personal AI system</div><div class="tabs"><button type="button" class="tab active" id="loginTab">Login</button><button type="button" class="tab" id="signupTab">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submitButton" type="submit">Sign in</button><div id="status"></div></form></div></section>
<section id="dashboard"><div class="shell"><aside class="sidebar"><div class="sidebar-logo">VIRANI</div><button class="new-chat" id="newChatButton">＋ New chat</button><div class="nav-item active">◉ Chats</div><div class="nav-item">▦ Projects</div><div class="nav-item">◇ Agents</div><div class="nav-item">◈ Memory</div><div class="nav-item">□ Files</div><div class="nav-item">⌘ Apps</div><div class="nav-item">⚙ Settings</div><div class="history-title">Recent chats</div><div id="conversationList" class="conversation-list"></div><div class="sidebar-bottom">Gemini brain connected</div></aside><main class="main"><header class="topbar"><div class="online">● <b>Virani</b> is online</div><div class="top-actions"><span id="userEmail"></span><button id="logoutButton">Log out</button></div></header><section class="chat"><div id="messages" class="messages"></div><div id="welcome" class="welcome"><div class="orb-wrap"><div class="orb-glow"></div><div class="ray"></div><div class="ray r2"></div><div class="ray r3"></div><div class="orb"><div class="orb-core"></div></div></div><h1>VIRANI</h1><p>Your personal AI system</p></div><div id="typing" class="typing" style="display:none">Virani is thinking…</div><div class="status-line"><span id="statusDot" class="status-dot"></span><span id="voiceStatus">Microphone off</span><span>•</span><span>ULTRON VOICE</span></div><div class="ultron-label">VOICE SYSTEM ONLINE</div><div class="composer"><button class="icon" id="voiceButton" title="Toggle always-on microphone">🎙️</button><input id="messageInput" placeholder="Talk to Virani or type..." autocomplete="off"><button class="icon" id="attachButton" title="Files">📎</button><input id="viraniFileInput" type="file" multiple hidden><span id="viraniFileLabel" style="display:none;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8d949f;font-size:11px"></span><input id="viraniFileInput" type="file" multiple hidden><span id="viraniFileLabel" style="display:none;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8d949f;font-size:11px"></span><button class="send" id="sendButton" title="Send">➤</button></div></section></main></div></section>
<script>
(()=>{
  'use strict';
  const URL='https://hfczfnaaqwsmvgahiygc.supabase.co';
  const KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS';
  const BRAIN=URL+'/functions/v1/virani-gemini';
  const sb=window.supabase.createClient(URL,KEY);
  const $=id=>document.getElementById(id);
  let user=null,chat=null,signup=false,sending=false,listening=false,recognition=null,speaking=false;
  const auth=$('authScreen'),dash=$('dashboard'),input=$('messageInput'),msgs=$('messages'),welcome=$('welcome');
  function authMode(v){signup=v;$('loginTab').classList.toggle('active',!v);$('signupTab').classList.toggle('active',v);$('submitButton').textContent=v?'Create account':'Sign in';$('status').textContent=''}
  $('loginTab').onclick=()=>authMode(false);$('signupTab').onclick=()=>authMode(true);
  $('authForm').onsubmit=async e=>{e.preventDefault();$('submitButton').disabled=true;$('status').textContent=signup?'Creating account…':'Signing in…';try{const r=signup?await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value}):await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;if(signup&&!r.data.session){$('status').textContent='Account created. Check your email, then sign in.';authMode(false)}else await enter(r.data.user)}catch(e){$('status').textContent=e.message||'Authentication failed.'}finally{$('submitButton').disabled=false}};
  async function enter(u){user=u;auth.style.display='none';dash.style.display='block';$('userEmail').textContent=u.email||'';await loadChats();setTimeout(()=>setListening(true),700)}
  async function loadChats(){const r=await sb.from('conversations').select('id,title').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(25);$('conversationList').innerHTML='';(r.data||[]).forEach(c=>{const x=document.createElement('div');x.className='conversation';x.textContent=c.title||'New Chat';x.onclick=()=>loadChat(c.id);$('conversationList').appendChild(x)})}
  async function newChat(){const r=await sb.from('conversations').insert({user_id:user.id,title:'New Chat'}).select().single();if(r.error)throw r.error;chat=r.data;msgs.innerHTML='';welcome.style.display='flex'}
  async function loadChat(id){const c=await sb.from('conversations').select('*').eq('id',id).eq('user_id',user.id).single();if(c.error)return;chat=c.data;msgs.innerHTML='';welcome.style.display='none';const m=await sb.from('messages').select('role,content').eq('conversation_id',id).eq('user_id',user.id).order('created_at');(m.data||[]).forEach(x=>render(x.role,x.content,false))}
  function render(role,text,voice){welcome.style.display='none';const r=document.createElement('div');r.className='message-row '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;r.appendChild(b);msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;if(role==='assistant'){ $('contextBody')&&($('contextBody').textContent=text); if(voice)speak(text)}}
  function stopSpeak(){if(window.speechSynthesis){speechSynthesis.cancel();speaking=false}}
  function voice(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices();return vs.find(v=>/en-(US|GB)/i.test(v.lang))||vs[0]}
  function speak(text){stopSpeak();if(!window.speechSynthesis)return;speaking=true;stopRecognition();const u=new SpeechSynthesisUtterance(text.length>1000?text.slice(0,1000)+'…':text);u.lang='en-US';u.rate=.88;u.pitch=.5;const v=voice();if(v)u.voice=v;u.onend=()=>{speaking=false;if(listening)setTimeout(startRecognition,300)};u.onerror=u.onend;speechSynthesis.speak(u)}
  function stopRecognition(){if(recognition){try{recognition.stop()}catch{}recognition=null}}
  function startRecognition(){if(!listening||speaking||recognition)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('voiceStatus').textContent='Voice unavailable';return}recognition=new R();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const t=(e.results?.[0]?.[0]?.transcript||'').trim();recognition=null;if(t){input.value=t;sendMessage()}};recognition.onerror=e=>{recognition=null;if(e.error==='not-allowed'||e.error==='service-not-allowed'){setListening(false);$('voiceStatus').textContent='Microphone permission required'}};recognition.onend=()=>{recognition=null;if(listening&&!speaking)setTimeout(startRecognition,500)};try{recognition.start()}catch{recognition=null}}
  function setListening(on){listening=on;$('voiceButton').classList.toggle('listening',on);$('statusDot').classList.toggle('on',on);$('voiceStatus').textContent=on?'Listening…':'Microphone off';if(on)startRecognition();else stopRecognition()}
  async function sendMessage(){if(sending)return;const text=input.value.trim();if(!text||!user)return;sending=true;$('sendButton').disabled=true;$('typing').style.display='block';input.value='';try{if(!chat)await newChat();render('user',text,false);const session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Session expired.');const a=await sb.from('messages').insert({conversation_id:chat.id,user_id:user.id,role:'user',content:text});if(a.error)throw a.error;const r=await fetch(BRAIN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({message:text})});const d=await r.json();if(!r.ok)throw Error(d.error||'Brain request failed');await sb.from('messages').insert({conversation_id:chat.id,user_id:user.id,role:'assistant',content:d.reply});await sb.from('conversations').update({title:text.slice(0,55),updated_at:new Date().toISOString()}).eq('id',chat.id).eq('user_id',user.id);render('assistant',d.reply,true);await loadChats()}catch(e){render('assistant','I could not reach my AI brain: '+(e.message||'Please try again.'))}finally{$('typing').style.display='none';$('sendButton').disabled=false;sending=false}}
  $('sendButton').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}};$('voiceButton').onclick=()=>setListening(!listening);$('newChatButton').onclick=()=>newChat();$('logoutButton').onclick=async()=>{setListening(false);stopSpeak();await sb.auth.signOut();location.reload()};
  $('attachButton').onclick=()=>$('viraniFileInput').click();$('viraniFileInput').onchange=e=>{const f=[...e.target.files];$('viraniFileLabel').textContent=f.length?(f.length===1?f[0].name:f.length+' files selected'):'';$('viraniFileLabel').style.display=f.length?'inline-block':'none'};
  window.addEventListener('pagehide',()=>{setListening(false);stopSpeak()});
  sb.auth.getSession().then(r=>{if(r.data.session)enter(r.data.session.user)});
})();
</script><!-- VIRANI_FILES_UI_V1 -->
<!-- VIRANI_PERFORMANCE_MEMORY_V2 --><script id="virani-performance-js">
(()=>{
  'use strict';
  const SUPA_URL='https://hfczfnaaqwsmvgahiygc.supabase.co';
  const SUPA_KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS';
  const BRAIN='/functions/v1/virani-gemini';
  const CONCISE='You are Virani, a professional personal AI assistant. Answer the user directly and briefly. Default to 1-5 short paragraphs or bullets. Do not repeat the question. Do not add filler, greetings, disclaimers, conclusions, or unnecessary step-by-step detail. Ask a clarifying question when the request is ambiguous or when an important detail is missing. Only give long/detailed answers when the user asks for detail, a plan, or a comprehensive explanation. If the user asks a simple question, give a simple answer.';
  let memoryCache=[];
  async function client(){return window.supabase?.createClient?.(SUPA_URL,SUPA_KEY)}
  async function loadMemory(){try{const c=await client();if(!c)return;const {data:{session}}=await c.auth.getSession();if(!session)return;const {data}=await c.from('memories').select('memory,category,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(25);memoryCache=data||[]}catch(e){}}
  loadMemory();
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async (input,init={})=>{try{const url=typeof input==='string'?input:(input?.url||'');if(url.includes(BRAIN)&&init.body){const d=JSON.parse(init.body);const mem=memoryCache.slice(0,12).map(x=>'- '+x.memory).join('\n');const context=CONCISE+(mem?'\n\nRelevant long-term memory (use only when relevant):\n'+mem:'');if(typeof d.message==='string')d.message=context+'\n\nUSER REQUEST:\n'+d.message;if(Array.isArray(d.messages))d.messages=[{role:'system',content:context},...d.messages];init={...init,body:JSON.stringify(d)}}}catch(e){}return nativeFetch(input,init)};
  if(window.speechSynthesis){const nativeSpeak=window.speechSynthesis.speak.bind(window.speechSynthesis);window.speechSynthesis.speak=function(u){try{let t=(u.text||'').replace(/```[\s\S]*?```/g,'Code omitted from voice output.').trim();if(t.length>1100)t=t.slice(0,1100).replace(/\s+\S*$/,'')+'…';u.text=t;u.rate=Math.max(.9,Math.min(1.02,u.rate||1))}catch(e){}return nativeSpeak(u)}}
  async function remember(text){if(!/\b(remember|don't forget|do not forget|my name is|call me|i prefer|my preference is|i like|i hate)\b/i.test(text))return;try{const c=await client();if(!c)return;const {data:{session}}=await c.auth.getSession();if(!session)return;await c.from('memories').insert({user_id:session.user.id,memory:text.slice(0,700),category:'conversation'});await loadMemory()}catch(e){}}
  const watch=()=>{const i=document.getElementById('messageInput');if(i&&i.value.trim())remember(i.value.trim())};
  document.getElementById('sendButton')?.addEventListener('click',watch);document.getElementById('messageInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey)watch()});
})();
</script></body>
