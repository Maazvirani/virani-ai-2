<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">
<title>Virani AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif} body{margin:0;min-height:100vh;background:#05070d;color:#fff}button,input{font:inherit}button{cursor:pointer}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:30px;border:1px solid #252c3d;border-radius:20px;background:#0d111c;box-shadow:0 20px 70px rgba(0,0,0,.45)}.logo{text-align:center;font-size:36px;font-weight:700;letter-spacing:8px}.subtitle{margin:8px 0 28px;text-align:center;color:#919bb0}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;border:0;border-radius:10px;padding:12px;background:#171d2b;color:#aab3c7;font-weight:700}.tab.active{background:#fff;color:#000}label{display:block;margin:14px 0 7px;color:#b9c1d2;font-size:14px}input{width:100%;padding:14px;border:1px solid #2a3347;border-radius:10px;outline:0;background:#080c14;color:#fff}input:focus{border-color:#7884ff}#submitButton{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:700}#submitButton:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-top:15px;color:#aeb7ca;text-align:center;font-size:13px;line-height:1.5}
#dashboard{display:none;min-height:100vh}.layout{min-height:100vh;display:flex}.sidebar{width:250px;padding:22px 15px;border-right:1px solid #1e2534;background:#080b13;display:flex;flex-direction:column}.sidebar-logo{margin:0 10px 28px;font-size:21px;font-weight:700;letter-spacing:5px}.new-chat{width:100%;padding:11px;border:1px solid #2b3448;border-radius:10px;background:#151b29;color:#fff;margin-bottom:15px}.nav-item{margin-bottom:5px;padding:12px;border-radius:9px;color:#aab3c7}.nav-item.active,.nav-item:hover{background:#151b29;color:#fff}.history-title{margin:20px 10px 8px;color:#667086;font-size:11px;text-transform:uppercase;letter-spacing:1px}.conversation-list{overflow:auto;max-height:45vh}.conversation{padding:10px;border-radius:9px;color:#aab3c7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.conversation:hover,.conversation.active{background:#111827;color:#fff}.sidebar-bottom{margin-top:auto;color:#788399;font-size:12px;padding:10px}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:70px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2534}.online{color:#aeb7ca;font-size:13px}#logoutButton{margin-left:10px;padding:9px 13px;border:1px solid #2b3448;border-radius:9px;background:#161c29;color:#fff}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:30px 20px 20px}.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#929bb0}.orb{width:105px;height:105px;margin-bottom:25px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#929dff 28%,#4c5bea 55%,#101968 78%,#03040b 100%);box-shadow:0 0 35px rgba(90,105,255,.55),0 0 100px rgba(90,105,255,.18)}.welcome h1{margin:0;color:#fff;font-size:40px}.message-row{display:flex;margin:0 auto 18px;width:min(900px,95%)}.message-row.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#20283a}.assistant .bubble{background:#0d111b;border:1px solid #20293a}.message-meta{font-size:10px;color:#667086;margin:5px 4px 0}.composer{width:min(900px,95%);margin:0 auto 25px;padding:9px;display:flex;gap:8px;align-items:center;border:1px solid #252d3e;border-radius:16px;background:#0d111b}.composer input{flex:1;border:0;background:transparent}.icon,.send{width:42px;height:42px;border:0;border-radius:10px}.icon{background:#171d2b;color:#fff}.send{background:#fff;color:#000}.send:disabled{opacity:.5;cursor:wait}.typing{color:#788399;font-size:13px;width:min(900px,95%);margin:0 auto 12px}
@media(max-width:700px){.sidebar{width:72px;padding:18px 7px}.sidebar-logo{margin:0 0 20px;font-size:10px;letter-spacing:2px;text-align:center}.new-chat{font-size:0;padding:11px}.new-chat:after{content:'+';font-size:20px}.nav-item{font-size:0;text-align:center}.nav-item::first-letter{font-size:18px}.history-title,.conversation,.sidebar-bottom{display:none}.welcome h1{font-size:29px}.topbar{padding:0 12px}.messages{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<section id="authScreen"><div class="card"><div class="logo">VIRANI</div><div class="subtitle">Your personal AI system</div><div class="tabs"><button type="button" class="tab active" id="loginTab">Login</button><button type="button" class="tab" id="signupTab">Create account</button></div><form id="authForm" novalidate><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required><button id="submitButton" type="submit">Sign in</button><div id="status" role="status" aria-live="polite"></div></form></div></section>
<section id="dashboard"><div class="layout"><aside class="sidebar"><div class="sidebar-logo">VIRANI</div><button class="new-chat" id="newChatButton" type="button">＋ New chat</button><div class="nav-item active">💬 Chats</div><div class="nav-item">📁 Projects</div><div class="nav-item">🤖 Agents</div><div class="nav-item">🧠 Memory</div><div class="nav-item">📄 Files</div><div class="nav-item">🔗 Apps</div><div class="nav-item">⚙️ Settings</div><div class="history-title">Recent chats</div><div id="conversationList" class="conversation-list"></div><div class="sidebar-bottom">Free foundation • More AI providers will be added next</div></aside><main class="main"><header class="topbar"><div class="online">🟢 Virani is online</div><div><span id="userEmail"></span><button id="logoutButton" type="button">Log out</button></div></header><section class="chat"><div id="messages" class="messages"><div id="welcome" class="welcome"><div class="orb"></div><h1>Hello. I'm Virani.</h1><p>Persistent chat, memory and AI tools are being built here.</p></div></div><div id="typing" class="typing" style="display:none">Virani is thinking…</div><div class="composer"><button type="button" class="icon" id="voiceButton" title="Voice">🎙️</button><input id="messageInput" placeholder="Ask Virani anything..." autocomplete="off"><button type="button" class="icon" id="attachButton" title="Attach">📎</button><button type="button" class="send" id="sendButton" title="Send">➤</button></div></section></main></div></section>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://hfczfnaaqwsmvgahiygc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS';
const authScreen=document.getElementById('authScreen'),dashboard=document.getElementById('dashboard'),authForm=document.getElementById('authForm'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),submitButton=document.getElementById('submitButton'),status=document.getElementById('status'),userEmail=document.getElementById('userEmail'),logoutButton=document.getElementById('logoutButton'),messages=document.getElementById('messages'),welcome=document.getElementById('welcome'),messageInput=document.getElementById('messageInput'),sendButton=document.getElementById('sendButton'),newChatButton=document.getElementById('newChatButton'),conversationList=document.getElementById('conversationList'),typing=document.getElementById('typing');
let mode='login',supabaseClient=null,currentUser=null,currentConversation=null;
const setStatus=m=>status.textContent=m||'';
function setMode(m){mode=m;const s=m==='signup';loginTab.classList.toggle('active',!s);signupTab.classList.toggle('active',s);submitButton.textContent=s?'Create account':'Sign in';setStatus('')}
function showDashboard(user){currentUser=user;authScreen.style.display='none';dashboard.style.display='block';userEmail.textContent=user?.email||'';loadConversations();}
function showLogin(){dashboard.style.display='none';authScreen.style.display='flex';currentUser=null;currentConversation=null}
async function saveProfile(user){if(!user)return;const{error}=await supabaseClient.from('profiles').upsert({id:user.id,email:user.email,display_name:user.email?user.email.split('@')[0]:'Virani User'});if(error)console.warn('Profile save skipped:',error.message)}
async function handleAuth(e){e.preventDefault();if(!supabaseClient){setStatus('Virani could not connect to Supabase. Refresh the page.');return}const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){setStatus('Please enter your email and password.');return}if(password.length<6){setStatus('Password must be at least 6 characters.');return}submitButton.disabled=true;setStatus(mode==='signup'?'Creating your account...':'Signing you in...');try{let r;if(mode==='signup'){r=await supabaseClient.auth.signUp({email,password});if(r.error)throw r.error;if(r.data.session&&r.data.user){await saveProfile(r.data.user);showDashboard(r.data.user);return}setStatus('Account created. Check your email to confirm your account, then log in.');setMode('login');return}r=await supabaseClient.auth.signInWithPassword({email,password});if(r.error)throw r.error;await saveProfile(r.data.user);showDashboard(r.data.user)}catch(err){console.error(err);setStatus(err?.message||'Authentication failed.')}finally{submitButton.disabled=false}}
function clearMessages(){messages.innerHTML='';welcome=document.createElement('div');welcome.id='welcome';welcome.className='welcome';welcome.innerHTML='<div class="orb"></div><h1>Hello. I\'m Virani.</h1><p>Persistent chat, memory and AI tools are being built here.</p>';messages.appendChild(welcome)}
function addMessage(role,content){if(welcome)welcome.remove();const row=document.createElement('div');row.className='message-row '+(role==='user'?'user':'assistant');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=content;row.appendChild(bubble);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
async function loadConversations(){conversationList.innerHTML='';const{data,error}=await supabaseClient.from('conversations').select('id,title,updated_at').eq('user_id',currentUser.id).order('updated_at',{ascending:false}).limit(30);if(error){console.warn('Conversation load:',error.message);return}for(const c of data||[]){const el=document.createElement('div');el.className='conversation'+(currentConversation?.id===c.id?' active':'');el.textContent=c.title||'New Chat';el.title=c.title||'New Chat';el.onclick=()=>openConversation(c.id);conversationList.appendChild(el)}}
async function createConversation(title='New Chat'){const{data,error}=await supabaseClient.from('conversations').insert({user_id:currentUser.id,title}).select('id,title,updated_at').single();if(error){console.error(error);return null}currentConversation=data;clearMessages();await loadConversations();return data}
async function openConversation(id){const{data:c,error}=await supabaseClient.from('conversations').select('id,title').eq('id',id).eq('user_id',currentUser.id).single();if(error){console.error(error);return}currentConversation=c;clearMessages();const{data:msgs,error:me}=await supabaseClient.from('messages').select('role,content,created_at').eq('conversation_id',id).eq('user_id',currentUser.id).order('created_at',{ascending:true});if(me){console.error(me);return}for(const m of msgs||[])addMessage(m.role,m.content);await loadConversations()}
async function sendMessage(){const text=messageInput.value.trim();if(!text||!currentUser||sendButton.disabled)return;if(!currentConversation){currentConversation=await createConversation(text.slice(0,60)||'New Chat');if(!currentConversation)return}messageInput.value='';addMessage('user',text);sendButton.disabled=true;typing.style.display='block';try{const{error}=await supabaseClient.from('messages').insert({conversation_id:currentConversation.id,user_id:currentUser.id,role:'user',content:text});if(error)throw error;await supabaseClient.from('conversations').update({title:text.slice(0,60)||'New Chat',updated_at:new Date().toISOString()}).eq('id',currentConversation.id).eq('user_id',currentUser.id);await loadConversations();/* AI provider will be connected in the next build step. */addMessage('assistant','I received your message and saved it to your Virani chat history. The free AI model connection is the next step.');await supabaseClient.from('messages').insert({conversation_id:currentConversation.id,user_id:currentUser.id,role:'assistant',content:'I received your message and saved it to your Virani chat history. The free AI model connection is the next step.'});}catch(err){console.error(err);addMessage('assistant','I could not save that message. Please try again.')}finally{typing.style.display='none';sendButton.disabled=false;messageInput.focus()}}
async function init(){if(!window.supabase?.createClient){setStatus('Virani could not load Supabase. Refresh the page.');return}try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const{data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(data?.session?.user)showDashboard(data.session.user);else showLogin()}catch(err){console.error(err);setStatus(err?.message||'Virani could not start.')}}
loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');authForm.onsubmit=handleAuth;logoutButton.onclick=async()=>{await supabaseClient.auth.signOut();showLogin();setMode('login')};newChatButton.onclick=async()=>{await createConversation()};sendButton.onclick=sendMessage;messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});voiceButton.onclick=()=>{if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){alert('Voice input is not supported by this browser. We will add a broader voice system later.');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang='en-US';r.interimResults=false;r.onresult=e=>{messageInput.value=e.results[0][0].transcript;messageInput.focus()};r.start()};document.getElementById('attachButton').onclick=()=>alert('File tools are being added next.');init();
})();
</script>
</body>
</html>
