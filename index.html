<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virani AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #05070c;
      color: white;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(
          circle at top left,
          rgba(80, 90, 255, 0.18),
          transparent 35%
        ),
        #05070c;
    }

    .auth-card {
      width: min(420px, 100%);
      background: #0c101b;
      border: 1px solid #222a3a;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 8px;
    }

    .brand p {
      color: #8c96ad;
      margin-top: 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #151b29;
      color: #9da6bb;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: white;
      color: #080a10;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #b3bccf;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #2a3347;
      background: #080c15;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #707dff;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: white;
      color: #07090d;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      color: #aeb8cc;
      font-size: 13px;
      line-height: 1.5;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
      background: #05070c;
    }

    .layout {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 245px;
      background: #080b13;
      border-right: 1px solid #1d2432;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 5px;
      margin: 0 10px 30px;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav-item {
      padding: 12px;
      border-radius: 10px;
      color: #aab3c7;
    }

    .nav-item.active,
    .nav-item:hover {
      background: #151b29;
      color: white;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid #1d2432;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #9da7ba;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #36d399;
    }

    .logout {
      background: #151b29;
      color: white;
      border: 1px solid #293247;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    .workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .orb {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 35%,
          white,
          #8e9aff 28%,
          #4b5bea 55%,
          #101b67 76%,
          #030513 100%
        );
      box-shadow:
        0 0 35px rgba(85,100,255,.55),
        0 0 100px rgba(85,100,255,.18);
    }

    .welcome h1 {
      margin: 0;
      font-size: 40px;
    }

    .welcome p {
      color: #8f99ad;
      margin-top: 12px;
    }

    .composer {
      width: min(900px, 90%);
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      background: #0d111b;
      border: 1px solid #252d3e;
      border-radius: 17px;
    }

    .composer input {
      border: 0;
      background: transparent;
      flex: 1;
      min-width: 0;
    }

    .icon-button,
    .send-button {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 0;
      cursor: pointer;
    }

    .icon-button {
      background: #151b29;
      color: white;
    }

    .send-button {
      background: white;
      color: black;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 18px 8px;
      }

      .sidebar-logo {
        font-size: 11px;
        letter-spacing: 2px;
        text-align: center;
      }

      .nav-item {
        font-size: 0;
        text-align: center;
      }

      .nav-item::first-letter {
        font-size: 18px;
      }

      .welcome h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN / SIGNUP -->

  <section class="auth-screen" id="authScreen">

    <div class="auth-card">

      <div class="brand">
        <h1>VIRANI</h1>
        <p>Your personal AI system</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab">
          Login
        </button>

        <button class="tab" id="signupTab">
          Create account
        </button>
      </div>

      <form id="authForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Password"
          minlength="6"
          required
        >

        <button class="primary" type="submit" id="submitButton">
          Sign in
        </button>

        <div class="status" id="status"></div>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section class="dashboard" id="dashboard">

    <div class="layout">

      <aside class="sidebar">

        <div class="sidebar-logo">
          VIRANI
        </div>

        <div class="nav">

          <div class="nav-item active">
            💬 Chats
          </div>

          <div class="nav-item">
            📁 Projects
          </div>

          <div class="nav-item">
            🤖 Agents
          </div>

          <div class="nav-item">
            🧠 Memory
          </div>

          <div class="nav-item">
            📄 Files
          </div>

          <div class="nav-item">
            🔗 Apps
          </div>

          <div class="nav-item">
            ⚙️ Settings
          </div>

        </div>

      </aside>


      <main class="main">

        <header class="topbar">

          <div class="online">
            <span class="dot"></span>
            Virani is online
          </div>

          <div>

            <span id="userEmail"></span>

            <button
              class="logout"
              id="logoutButton">
              Log out
            </button>

          </div>

        </header>


        <div class="workspace">

          <div class="welcome">

            <div class="orb"></div>

            <h1>
              Hello. I'm Virani.
            </h1>

            <p>
              Your personal AI system.
            </p>

          </div>

        </div>


        <div class="composer">

          <button
            class="icon-button"
            type="button">
            🎙️
          </button>

          <input
            id="messageInput"
            type="text"
            placeholder="Ask Virani anything..."
          >

          <button
            class="icon-button"
            type="button">
            📎
          </button>

          <button
            class="send-button"
            type="button">
            ➤
          </button>

        </div>

      </main>

    </div>

  </section>


  <script>

    /*
      =====================================================
      VIRANI SUPABASE CONNECTION

      Replace the two values below with your own values.
      =====================================================
    */

    const SUPABASE_URL =https://hfczfnaaqwsmvgahiygc.supabase.co/rest/v1/

    const SUPABASE_PUBLISHABLE_KEY =sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    let mode = "login";


    const authScreen =
      document.getElementById("authScreen");

    const dashboard =
      document.getElementById("dashboard");

    const authForm =
      document.getElementById("authForm");

    const status =
      document.getElementById("status");

    const submitButton =
      document.getElementById("submitButton");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const userEmail =
      document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");


    /*
      LOGIN TAB
    */

    loginTab.addEventListener(
      "click",
      () => {

        mode = "login";

        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        submitButton.textContent =
          "Sign in";

        status.textContent = "";

      }
    );


    /*
      SIGNUP TAB
    */

    signupTab.addEventListener(
      "click",
      () => {

        mode = "signup";

        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        submitButton.textContent =
          "Create account";

        status.textContent = "";

      }
    );


    /*
      LOGIN / SIGNUP
    */

    authForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email")
          .value
          .trim();

        const password =
          document.getElementById("password")
          .value;


        status.textContent =
          "Connecting to Virani...";


        try {

          /*
            CREATE ACCOUNT
          */

          if (mode === "signup") {

            const {
              data,
              error
            } =
              await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                  emailRedirectTo:
                    "https://virani-ai-2.pages.dev/"

                }

              });


            if (error) {
              throw error;
            }


            /*
              EMAIL CONFIRMATION ENABLED
            */

            if (!data.session) {

              status.textContent =
                "Account created. Check your email and confirm your account.";

              return;

            }


            await createProfile(data.user);

            showDashboard(data.user);

          }


          /*
            LOGIN
          */

          else {

            const {
              data,
              error
            } =
              await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


            if (error) {
              throw error;
            }


            await createProfile(data.user);

            showDashboard(data.user);

          }

        }

        catch (error) {

          console.error(error);

          status.textContent =
            error.message ||
            "Something went wrong.";

        }

      }
    );


    /*
      CREATE USER PROFILE
    */

    async function createProfile(user) {

      if (!user) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
        .from("profiles")
        .upsert({

          id: user.id,

          email: user.email,

          display_name:
            user.email
              ? user.email.split("@")[0]
              : "Virani User"

        });


      if (error) {

        console.error(
          "Profile error:",
          error
        );

      }

    }


    /*
      LOGOUT
    */

    logoutButton.addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await supabaseClient.auth
          .signOut();


        if (error) {

          console.error(error);

          return;

        }


        showLogin();

      }
    );


    /*
      SHOW DASHBOARD
    */

    function showDashboard(user) {

      authScreen.style.display =
        "none";

      dashboard.style.display =
        "block";

      userEmail.textContent =
        user?.email ||
        "Virani User";

    }


    /*
      SHOW LOGIN
    */

    function showLogin() {

      dashboard.style.display =
        "none";

      authScreen.style.display =
        "flex";

    }


    /*
      WATCH LOGIN SESSION
    */

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session?.user) {

          showDashboard(
            session.user
          );

        }

        else {

          showLogin();

        }

      }
    );


    /*
      CHECK CURRENT SESSION
    */

    async function initialize() {

      const {
        data
      } =
        await supabaseClient.auth
        .getSession();


      if (data.session?.user) {

        showDashboard(
          data.session.user
        );

      }

      else {

        showLogin();

      }

    }


    initialize();

  </script>

</body>
</html>
