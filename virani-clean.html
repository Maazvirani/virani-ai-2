<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virani AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f3f5f7;font:14px system-ui,Segoe UI,Arial}button,input{font:inherit}.hidden{display:none!important}#auth{min-height:100vh;display:grid;place-items:center}.auth{width:min(410px,92vw);padding:28px;background:#12151a;border:1px solid #29303a;border-radius:14px}.logo{text-align:center;font-size:30px;font-weight:800;letter-spacing:6px}.muted{color:#89929d}.auth input{width:100%;margin:7px 0;padding:12px;background:#0c0f13;color:#fff;border:1px solid #29303a;border-radius:8px}.auth button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:8px;background:#eef1f3;color:#111;font-weight:700}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:#1a1e24;color:#aeb6c0;border:1px solid #29303a}.tabs .on{background:#eef1f3;color:#111}#app{display:none;height:100vh}.layout{display:flex;height:100%}.side{width:220px;background:#0e1014;border-right:1px solid #252b33;padding:14px;display:flex;flex-direction:column}.brand{font-weight:800;letter-spacing:4px;margin:6px 8px 18px}.sidebtn,.nav{width:100%;text-align:left;padding:9px 10px;border-radius:8px;background:none;border:0;color:#a8b0ba}.sidebtn:hover,.nav:hover{background:#171b21;color:#fff}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:56px;border-bottom:1px solid #252b33;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.chat{position:relative;flex:1;overflow:hidden}.messages{position:absolute;inset:0;overflow:auto;padding:24px 18px 100px}.row{display:flex;max-width:850px;margin:0 auto 12px}.row.user{justify-content:flex-end}.bubble{max-width:78%;white-space:pre-wrap;line-height:1.55;padding:10px 13px;border-radius:12px}.user .bubble{background:#1c2229}.assistant .bubble{background:#0e1115}.welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}.orb{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,#fff 0 2%,#6ee7d6 5%,#159a89 18%,#112d31 45%,#080a0c 70%);box-shadow:0 0 30px #28d9c055}.welcome h1{margin:14px 0 4px;font-size:22px;letter-spacing:4px}.composer{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(850px,94%);display:flex;gap:7px;padding:7px;background:#12161b;border:1px solid #2a313a;border-radius:13px}.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:10px}.btn{width:40px;height:40px;border-radius:8px;border:1px solid #2a313a;background:#171b21;color:#fff}.send{background:#eef1f3;color:#111}.on{border-color:#38d7c3;color:#6ce9dc}.status{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);font-size:10px;color:#707985;white-space:nowrap}.panel{position:absolute;inset:12px;background:#101318;border:1px solid #2a313a;border-radius:12px;display:none;flex-direction:column;z-index:5}.panel.open{display:flex}.panelhead{padding:10px 12px;border-bottom:1px solid #2a313a;display:flex;justify-content:space-between}.panelbody{padding:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.card{background:#0d1014;border:1px solid #2a313a;border-radius:10px;padding:12px}.small{padding:8px 9px;border:1px solid #303740;background:#171b21;color:#fff;border-radius:7px}.field{width:100%;background:#0b0e12;color:#fff;border:1px solid #303740;border-radius:8px;padding:9px;margin:5px 0}.code{width:100%;min-height:300px;background:#090b0e;color:#dfe6ed;border:1px solid #303740;border-radius:8px;padding:12px;font:13px ui-monospace,monospace}.rowbtn{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:760px){.side{display:none}.composer{width:calc(100% - 20px)}} </style></head><body><section id="auth"><div class="auth"><div class="logo">VIRANI</div><div class="muted" style="text-align:center;margin:8px 0">Personal AI system</div><div class="tabs"><button id="loginTab" class="on">Login</button><button id="signupTab">Create account</button></div><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="authBtn">Sign in</button><div id="authMsg" class="muted" style="text-align:center;margin-top:10px"></div></div></section><section id="app"><div class="layout"><aside class="side"><div class="brand">VIRANI</div><button id="newChat" class="sidebtn">＋ New chat</button><button class="nav" data-panel="none">◉ Chats</button><button class="nav" data-panel="projects">▦ Projects</button><button class="nav" data-panel="agents">◇ Agents</button><button class="nav" data-panel="memory">◈ Memory</button><button class="nav" data-panel="files">□ Files</button><button class="nav" data-panel="apps">⌘ Apps</button><button class="nav" data-panel="settings">⚙ Settings</button><div style="margin-top:auto" class="muted">Gemini + OpenRouter</div></aside><main class="main"><header class="top"><span class="muted">● <b style="color:#eee">Virani</b> online</span><div><span id="userEmail" class="muted"></span> <button id="logout" class="small">Log out</button></div></header><section class="chat"><div id="messages" class="messages"></div><div id="welcome" class="welcome"><div><div class="orb"></div><h1>VIRANI</h1><div class="muted">Your personal AI system</div></div></div><div id="panel" class="panel"><div class="panelhead"><b id="panelTitle">Workspace</b><button id="panelClose" class="small">Close</button></div><div id="panelBody" class="panelbody"></div></div><div id="statusLine" class="status">Microphone off</div><div class="composer"><button id="mic" class="btn">🎙️</button><input id="text" placeholder="Talk to Virani or type…"><button id="attach" class="btn">📎</button><button id="send" class="btn send">➤</button></div></section></main></div></section><input id="file" type="file" multiple hidden><script>(()=>{const URL='https://hfczfnaaqwsmvgahiygc.supabase.co',KEY='sb_publishable_AfyF3k8-uEzorkoYC98D-Q_QRlgkuvS',BRAIN=URL+'/functions/v1/virani-gemini',sb=supabase.createClient(URL,KEY);let user=null,chat=null,signup=false,sending=false,listening=false,rec=null;const $=id=>document.getElementById(id);const openPanel=title=>{$('panelTitle').textContent=title;$('panel').classList.add('open')};const closePanel=()=>{$('panel').classList.remove('open')};function add(role,text){$('welcome').classList.add('hidden');const r=document.createElement('div');r.className='row '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;r.appendChild(b);$('messages').appendChild(r);$('messages').scrollTop=$('messages').scrollHeight}async function loadChats(){}async function enter(u){user=u;$('auth').style.display='none';$('app').style.display='block';$('userEmail').textContent=u.email||'';setListening(true)}async function doAuth(){const email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return;$('authBtn').disabled=true;try{const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(signup&&!r.data.session){$('authMsg').textContent='Check your email to confirm the account.';signup=false;$('authBtn').textContent='Sign in'}else await enter(r.data.user)}catch(e){$('authMsg').textContent=e.message||'Authentication failed'}finally{$('authBtn').disabled=false}}async function send(){if(sending)return;const v=$('text').value.trim();if(!v||!user)return;sending=true;$('send').disabled=true;$('text').value='';add('user',v);try{if(!chat){const r=await sb.from('conversations').insert({user_id:user.id,title:v.slice(0,55)}).select().single();if(r.error)throw r.error;chat=r.data}await sb.from('messages').insert({conversation_id:chat.id,user_id:user.id,role:'user',content:v});const session=(await sb.auth.getSession()).data.session;const r=await fetch(BRAIN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({message:v})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Brain request failed');await sb.from('messages').insert({conversation_id:chat.id,user_id:user.id,role:'assistant',content:d.reply});add('assistant',d.reply);speak(d.reply)}catch(e){add('assistant','I could not reach my AI brain: '+e.message);speak('I could not reach my AI brain.')}finally{sending=false;$('send').disabled=false;$('text').focus()}}function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.length>900?t.slice(0,900)+'…':t);u.lang='en-US';u.rate=.88;u.pitch=.5;u.onend=()=>{if(listening)startRec()};speechSynthesis.speak(u)}function startRec(){if(!listening||speechSynthesis.speaking)return;const R=SpeechRecognition||webkitSpeechRecognition;if(!R){$('statusLine').textContent='Voice unavailable';return}if(!rec){rec=new R();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.onresult=e=>{$('text').value=e.results[0][0].transcript;send()};rec.onend=()=>{if(listening&&!speechSynthesis.speaking)setTimeout(startRec,300)}}try{rec.start()}catch{}}function stopRec(){try{rec?.stop()}catch{}}function setListening(on){listening=on;$('mic').classList.toggle('on',on);$('statusLine').textContent=on?'Listening…':'Microphone off';on?startRec():stopRec()}async function showProjects(){if(!user)return;openPanel('Projects');const r=await sb.from('projects').select('id,name,description').eq('user_id',user.id).order('updated_at',{ascending:false});$('panelBody').innerHTML='<div class="rowbtn"><button id="newProject" class="small">+ New project</button></div><div id="projectGrid" class="grid" style="margin-top:10px"></div>';const g=$('projectGrid');(r.data||[]).forEach(p=>{const c=document.createElement('div');c.className='card';c.innerHTML='<b></b><p class="muted"></p><button class="small">Open editor</button>';c.querySelector('b').textContent=p.name;c.querySelector('p').textContent=p.description||'';c.querySelector('button').onclick=()=>openEditor(p);g.appendChild(c)});$('newProject').onclick=async()=>{const n=prompt('Project name');if(!n)return;await sb.from('projects').insert({user_id:user.id,name:n});showProjects()}}async function openEditor(p){openPanel(p.name+' — Editor');const r=await sb.from('project_files').select('id,path,content').eq('project_id',p.id).eq('user_id',user.id).order('path');$('panelBody').innerHTML='<div class="rowbtn"><button id="newFile" class="small">+ New file</button><button id="saveFile" class="small">Save</button></div><div class="grid" style="margin-top:10px"><div class="card"><b>Files</b><div id="fileList"></div></div><div class="card"><input id="path" class="field" placeholder="src/app.js"><textarea id="code" class="code"></textarea></div></div>';const fl=$('fileList');(r.data||[]).forEach(f=>{const b=document.createElement('button');b.className='small';b.style='display:block;width:100%;margin-top:6px;text-align:left';b.textContent=f.path;b.onclick=()=>{$('path').value=f.path;$('code').value=f.content||''};fl.appendChild(b)});$('newFile').onclick=()=>{$('path').value='index.html';$('code').value='';$('code').focus()};$('saveFile').onclick=async()=>{const path=$('path').value.trim();if(!path)return;await sb.from('project_files').upsert({project_id:p.id,user_id:user.id,path,content:$('code').value,language:path.endsWith('.js')?'javascript':path.endsWith('.css')?'css':path.endsWith('.html')?'html':'text',updated_at:new Date().toISOString()},{onConflict:'project_id,path'});await openEditor(p)}}async function showAgents(){if(!user)return;openPanel('Agents');const r=await sb.from('agents').select('id,name,description,enabled').eq('user_id',user.id);$('panelBody').innerHTML='<div class="rowbtn"><button id="newAgent" class="small">+ New agent</button></div><div id="agentGrid" class="grid" style="margin-top:10px"></div>';const g=$('agentGrid');(r.data||[]).forEach(a=>{const c=document.createElement('div');c.className='card';c.innerHTML='<b></b><p class="muted"></p>';c.querySelector('b').textContent=a.name;c.querySelector('p').textContent=(a.enabled?'Enabled':'Disabled')+' • '+(a.description||'');g.appendChild(c)});$('newAgent').onclick=async()=>{const n=prompt('Agent name');if(!n)return;await sb.from('agents').insert({user_id:user.id,name:n,description:'Virani agent'});showAgents()}}function simplePanel(name,text){openPanel(name);$('panelBody').textContent=text}$('loginTab').onclick=()=>{signup=false;$('loginTab').classList.add('on');$('signupTab').classList.remove('on');$('authBtn').textContent='Sign in'};$('signupTab').onclick=()=>{signup=true;$('signupTab').classList.add('on');$('loginTab').classList.remove('on');$('authBtn').textContent='Create account'};$('authBtn').onclick=doAuth;$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};$('mic').onclick=()=>setListening(!listening);$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{const f=[...e.target.files];simplePanel('Files selected',f.length?f.map(x=>x.name).join('\n'):'No files')};$('newChat').onclick=()=>{chat=null;$('messages').innerHTML='';$('welcome').classList.remove('hidden');closePanel()};$('panelClose').onclick=closePanel;$('logout').onclick=async()=>{setListening(false);await sb.auth.signOut();location.reload()};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const p=b.dataset.panel;if(p==='projects')showProjects();else if(p==='agents')showAgents();else if(p==='memory')simplePanel('Memory','Your saved memories are stored securely in Supabase.');else if(p==='files')simplePanel('Files','File picker is available. Full file analysis remains a separate module.');else if(p==='apps')simplePanel('Apps','App connections are ready for integrations.');else if(p==='settings')simplePanel('Settings','Virani settings will be added here.');else closePanel()});sb.auth.getSession().then(r=>{if(r.data.session)enter(r.data.session.user)});})();</script></body></html>
